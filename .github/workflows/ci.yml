name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: TypeScript
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, comments and versions
        run: pnpm format:check && pnpm comments:check && pnpm version:check

      - name: Lint and type check
        run: pnpm lint && pnpm check

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Site examples, demos and build
        run: pnpm site:examples && pnpm site:demos && pnpm site:build

      - name: Size and package checks
        run: pnpm size && pnpm pkg:check

      - name: Audit dependencies
        run: pnpm audit:deps

  go:
    name: Go
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14.0
          install-only: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Vet and lint
        run: go vet ./... && golangci-lint run

      - name: Test with coverage
        run: node scripts/go-cover.ts

      - name: Vulnerability check
        run: govulncheck ./...

  data:
    name: Data
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Check datasets against the manifest
        run: node scripts/data-check.ts

  secrets:
    name: Secret scan
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan the full history
        run: gitleaks git --redact --no-banner --log-opts="--all" .
